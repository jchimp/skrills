services:
  skrills:
    build: .
    container_name: skrills
    restart: unless-stopped
    ports:
      - "8088:8000"
    volumes:
      - ./data:/app/data
    environment:
      SKRILLS_DB: /app/data/skrills.db
      # Toggle ephemeral default: if true, scans aren't persisted unless explicitly enabled per request
      SKRILLS_EPHEMERAL_DEFAULT: "false"
      # Optional Garak sidecar URL; leave empty to disable
      SKRILLS_GARAK_URL: ""
      # Snyk Labs is stubbed; toggle to attempt public probe (currently no-op)
      SKRILLS_SNYK_ENABLED: "false"
      # ---- Public-web hardening ----
      # true => no persistence/history, heuristics+gitleaks only, rate limiting on.
      # Terminate TLS at a reverse proxy in front of this and forward X-Forwarded-For.
      SKRILLS_PUBLIC: "false"
      # Server-side cap on pasted content (bytes). Body cap = this + 64 KB headroom.
      SKRILLS_MAX_CONTENT_BYTES: "200000"
      # Per-client rate limit (only enforced when SKRILLS_PUBLIC=true)
      SKRILLS_RATE_LIMIT: "10/minute"

  # Optional: uncomment to run Garak as a sidecar. Image is large.
  # garak:
  #   image: ghcr.io/nvidia/garak:latest
  #   container_name: skrills-garak
  #   restart: unless-stopped
  #   command: ["serve", "--host", "0.0.0.0", "--port", "9000"]
  #   expose:
  #     - "9000"

services:
  skrills:
    build: .
    container_name: skrills
    restart: unless-stopped
    ports:
      - "8088:8000"
    volumes:
      - ./data:/app/data
    environment:
      SKRILLS_DB: /app/data/skrills.db
      SKRILLS_SCRATCH: /app/scratch
      SKRILLS_EPHEMERAL_DEFAULT: "false"

      # Repo ingest limits
      SKRILLS_MAX_UPLOAD_MB: "50"
      SKRILLS_MAX_FILE_COUNT: "5000"
      SKRILLS_GIT_CLONE_TIMEOUT: "60"
      SKRILLS_GIT_HOST_ALLOWLIST: "github.com,gitlab.com,bitbucket.org"

      # Sidecars
      SKRILLS_GARAK_URL: ""
      SKRILLS_SEMGREP_URL: "http://semgrep:9001"
      SKRILLS_SNYK_ENABLED: "false"
    depends_on:
      - semgrep

  semgrep:
    image: returntocorp/semgrep:latest
    container_name: skrills-semgrep
    restart: unless-stopped
    # Lightweight HTTP wrapper: a tiny FastAPI side-process in front of `semgrep scan`.
    # See /sidecars/semgrep/ in this repo for the source.
    command: >
      sh -c "pip install --quiet fastapi uvicorn python-multipart &&
             uvicorn server:app --host 0.0.0.0 --port 9001 --app-dir /srv"
    volumes:
      - ./sidecars/semgrep:/srv:ro
    expose:
      - "9001"

  # Optional: Garak red-team sidecar. Image is large.
  # garak:
  #   image: ghcr.io/nvidia/garak:latest
  #   container_name: skrills-garak
  #   restart: unless-stopped
  #   command: ["serve", "--host", "0.0.0.0", "--port", "9000"]
  #   expose:
  #     - "9000"

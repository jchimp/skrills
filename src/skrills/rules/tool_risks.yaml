# Skrills heuristic rule pack — tool poisoning & excessive agency
# Targets dangerous tool definitions/permissions inside agent skills.

rules:
  - id: SK-TOOL-001
    title: "Shell / command execution tool"
    severity: critical
    category: tool_poisoning
    pattern: "\\b(exec|eval|subprocess|os\\.system|shell_exec|child_process|Runtime\\.getRuntime|powershell|cmd\\.exe|/bin/sh|/bin/bash)\\b"
    description: >
      Skill references shell or arbitrary code execution. Strongly review.
    remediation: >
      Replace with narrowly-scoped, parameterized tools. Never let the model
      pass arbitrary strings to a shell.

  - id: SK-TOOL-002
    title: "Unrestricted file system access"
    severity: high
    category: excessive_agency
    pattern: "(read_file|write_file|delete_file|fs\\.(read|write|unlink))\\s*[:(]"
    description: >
      Tool that can read/write/delete files without an explicit allowlist.
    remediation: Constrain to a specific directory and validate paths.

  - id: SK-TOOL-003
    title: "Outbound HTTP / network without allowlist"
    severity: high
    category: excessive_agency
    pattern: "\\b(fetch|requests\\.(get|post|put|delete)|http\\.(get|post)|urllib\\.request|axios\\.(get|post))\\b"
    description: >
      Skill defines unrestricted outbound network calls — potential SSRF and
      data exfiltration vector.
    remediation: Use a host allowlist and explicit method/URL templates.

  - id: SK-TOOL-004
    title: "Database query tool without parameter binding"
    severity: high
    category: tool_poisoning
    pattern: "(execute|query|raw_sql|run_sql)\\s*\\(\\s*[\"']?\\s*(select|insert|update|delete|drop)"
    description: >
      Tool appears to accept raw SQL. High risk of SQL injection via prompt.
    remediation: Use the query-planner pattern, parameterized statements, and
      read-only credentials.

  - id: SK-TOOL-005
    title: "Credential or secret in skill manifest"
    severity: critical
    category: secret
    pattern: "(api[_-]?key|secret|password|token|bearer)\\s*[:=]\\s*[\"'][^\"']{8,}[\"']"
    description: >
      Inline credentials in skill content. Treat as compromised.
    remediation: Rotate immediately and move to env vars / vault.

  - id: SK-TOOL-006
    title: "Auto-approve / no-confirmation tool flag"
    severity: medium
    category: excessive_agency
    pattern: "\\b(auto[_-]?(approve|confirm|execute)|skip[_-]?confirmation|require_confirmation\\s*[:=]\\s*false)\\b"
    description: >
      Skill disables human-in-the-loop confirmation for tool calls.
    remediation: Require confirmation for any state-changing or external action.

  - id: SK-TOOL-007
    title: "Email/SMS sending tool"
    severity: medium
    category: excessive_agency
    pattern: "\\b(send_email|smtp|sendmail|twilio|send_sms|outlook\\.send)\\b"
    description: >
      Outbound messaging — abuse vector for phishing or data exfil.
    remediation: Constrain recipients to an allowlist; rate-limit; log all sends.

  - id: SK-TOOL-008
    title: "Payment / financial action tool"
    severity: critical
    category: excessive_agency
    pattern: "\\b(charge_card|create_payment|transfer_funds|stripe\\.(charge|paymentintent)|paypal\\.payout)\\b"
    description: >
      Skill exposes financial transactions to the agent. Maximum caution.
    remediation: Require strong out-of-band confirmation and strict amount caps.

  - id: SK-TOOL-009
    title: "Long-lived / wildcard scope"
    severity: medium
    category: excessive_agency
    pattern: "(scope|permissions?)\\s*[:=]\\s*[\"']?(\\*|all|admin|root|full[_-]?access)"
    description: >
      Skill requests wildcard or admin scopes. Apply least-privilege.

  - id: SK-TOOL-010
    title: "Browser / RPA automation tool"
    severity: medium
    category: excessive_agency
    pattern: "\\b(playwright|puppeteer|selenium|browser_use|computer_use)\\b"
    description: >
      Skill drives a browser/desktop. Risk of credential capture and arbitrary
      web actions.
    remediation: Sandbox the browser session; never load real user profiles.
